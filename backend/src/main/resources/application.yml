spring:
  profiles:
    active: dev
  http:
    client:
      # #39（导师V5复验案）：书面问首击500重试即好=瞬时故障，根因chat/embedding无显式超时——
      # Spring AI 的 RestClient 吃 Boot 全局客户端超时；超时类失败归"下游挂了"桶(NonTransient同家法)
      connect-timeout: 10s
      read-timeout: 60s
server:
  port: 8080
kb:
  search:
    top-k: 3
    distance-max: 0.3   # #41裁定(2026-11-19)：0.25对口语query偏严——10条golden实测书面5/5、口语3/5，
                        # 两条擦边过(0.208/0.225)；书面最好d=0.086，放宽到0.3不引噪声。diff存档见 docs/eval/
review:
  # 合同09 B/G4：Leitner 参数整组进 yml——换代 SM-2 时整组替换不动代码（ReviewProperties 绑定）
  intervals-days: 1,3,7,16,35   # 五盒间隔（天），盒号即下标+1
  promote-min-score: 4          # >=4 前进一盒（语义明确的正向信号才配驱动状态转移）
  demote-max-score: 2           # <=2 回盒一；同一把尺也是入队钩子的错题边界
  profile-window: 5             # 曲线窗口：最近 N 次判分均值×20（G4，W8 手算对拍口径）
  processing-lease-minutes: 30  # processing 租约：kill -9 死锁洞的堵法（待导师追认条款）
followup:
  # 合同10 E 旋钮（#59）：预期会被调的预算值；max-depth 是规则资产在 FollowupDecision.MAX_DEPTH，不进 yml
  max-per-interview: 6   # 树节点口径熔断，执法在生成前；双并发窗口超限1-2发接受（09 W5 论据）；X5 演练曾临时调 2，已归位
  max-tokens: 800        # S14重演修正(11-22实弹)：模型出SQL场景题干≈3t/字，400腰斩(EOF col205铁证)，800后 444 收官数据落位；算式修订已报备